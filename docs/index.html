<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PipStream AI Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Optional: Customize to match pipstream brand */
    :root {
      --theme-color: #42b983; /* Change this to your brand color */
    }
  </style>
</head>
<body>
  <div id="app">Loading Docs...</div>
  <script>
    window.$docsify = {
      name: 'PipStream Engine',
      repo: '', // or 'https://github.com/ai-pipestream' if you want a github corner icon
      loadSidebar: true,  // Enables the 'Explorer' file tree
      subMaxLevel: 3,     // Auto-generates Table of Contents from headers
      auto2top: true,     // Scrolls to top when changing pages
      search: 'auto',     // Enables search box
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
