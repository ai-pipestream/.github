<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PipStream AI Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Optional: Customize to match pipstream brand */
    :root {
      --theme-color: #42b983; /* Change this to your brand color */
    }
  </style>
</head>
<body>
  <!-- Theme toggle button -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <span id="themeIcon">🌙</span>
  </button>
  
  <div id="app">Loading Docs...</div>
  
  <!-- Theme toggle script (must run before Docsify) -->
  <script>
    (function() {
      // Check for saved theme preference or default to system preference
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
      
      // Apply theme immediately to prevent flash
      if (isDark) {
        document.body.classList.add('dark-mode');
      }
      
      // Wait for DOM to be ready
      document.addEventListener('DOMContentLoaded', function() {
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        // Update icon based on current theme
        function updateIcon() {
          const isDarkMode = document.body.classList.contains('dark-mode');
          themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
        }
        
        updateIcon();
        
        // Toggle theme on button click
        themeToggle.addEventListener('click', function() {
          document.body.classList.toggle('dark-mode');
          const isDarkMode = document.body.classList.contains('dark-mode');
          localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
          updateIcon();
        });
      });
    })();
  </script>
  
  <script>
    window.$docsify = {
      name: 'PipStream Engine',
      repo: '', // or 'https://github.com/ai-pipestream' if you want a github corner icon
      loadSidebar: true,  // Enables the 'Explorer' file tree
      subMaxLevel: 3,     // Auto-generates Table of Contents from headers
      auto2top: true,     // Scrolls to top when changing pages
      search: 'auto',     // Enables search box
      // Mermaid configuration (renders ```mermaid code blocks)
      mermaid: {
        theme: 'default',
        startOnLoad: true
      }
    }
  </script>
  
  <!-- Custom sidebar collapse behavior -->
  <script>
    // Fix sidebar collapse behavior - make all sections consistently toggleable
    (function() {
      // Wait for Docsify to load and render the sidebar
      window.$docsify = window.$docsify || {};
      const originalMounted = window.$docsify.mounted;
      
      window.$docsify.mounted = function() {
        if (originalMounted) originalMounted.apply(this, arguments);
        
        // Initialize sidebar collapse behavior after a short delay
        setTimeout(function() {
          const sidebar = document.querySelector('.sidebar');
          if (!sidebar) return;
          
          // Find all parent items (those with child lists)
          const parentItems = sidebar.querySelectorAll('li');
          
          parentItems.forEach(function(item) {
            const childList = item.querySelector('ul');
            if (!childList) return;
            
            // Find the link/strong element that should be clickable
            // Handle both <a> and <strong> as direct children, and <a> inside <strong>
            const toggleElement = item.querySelector(':scope > a, :scope > strong');
            if (!toggleElement) return;
            
            // Mark this item as collapsible
            item.classList.add('collapsible');
            
            // Add collapse arrow indicator
            const arrow = document.createElement('span');
            arrow.className = 'collapse-arrow';
            arrow.textContent = '▼';
            arrow.style.cssText = 'display: inline-block; margin-right: 5px; transition: transform 0.2s ease; cursor: pointer;';
            
            // Insert arrow at the beginning of the toggle element
            if (toggleElement.tagName === 'STRONG') {
              // For strong elements, insert before the first child
              toggleElement.insertBefore(arrow, toggleElement.firstChild);
            } else {
              // For link elements, insert before the first child
              toggleElement.insertBefore(arrow, toggleElement.firstChild);
            }
            
            // Check if this section should be initially expanded
            // (contains the active page or is a bold link)
            const isActive = item.querySelector('.active') || 
                           item.classList.contains('active');
            
            if (!isActive) {
              item.classList.add('collapsed');
              arrow.style.transform = 'rotate(-90deg)';
            }
            
            // Function to handle toggle
            function handleToggle(e) {
              // Check if this item has children - if so, treat it as a collapsible section
              if (childList && childList.children.length > 0) {
                // Prevent navigation and just toggle collapse
                e.preventDefault();
                e.stopPropagation();
                item.classList.toggle('collapsed');
                
                // Update arrow rotation
                if (item.classList.contains('collapsed')) {
                  arrow.style.transform = 'rotate(-90deg)';
                } else {
                  arrow.style.transform = 'rotate(0deg)';
                }
              }
              // If no children or empty children list, allow navigation as normal
            }
            
            // Add click handler for toggling to the main element
            toggleElement.addEventListener('click', handleToggle);
            
            // Also add handler to any nested <a> inside <strong>
            const nestedLink = toggleElement.querySelector('a');
            if (nestedLink) {
              nestedLink.addEventListener('click', handleToggle);
            }
          });
          
          // Add CSS for collapse behavior
          if (!document.getElementById('sidebar-collapse-styles')) {
            const style = document.createElement('style');
            style.id = 'sidebar-collapse-styles';
            style.textContent = `
              .sidebar li.collapsible.collapsed > ul {
                display: none;
              }
              /* Make sure nested links in strong elements are styled correctly */
              .sidebar li.collapsible > strong > a {
                text-decoration: inherit;
                color: inherit;
              }
              /* Style for collapse arrow */
              .sidebar .collapse-arrow {
                user-select: none;
                -webkit-user-select: none;
              }
            `;
            document.head.appendChild(style);
          }
        }, 100);
      };
    })();
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Mermaid support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid/dist/docsify-mermaid.min.js"></script>
</body>
</html>
