name: Reusable Docker Hub Publish

on:
  workflow_call:
    inputs:
      base_image:
        description: 'Base GHCR image (e.g., ghcr.io/ai-pipestream/platform-registration-service)'
        required: true
        type: string
      dockerhub_repo:
        description: 'Docker Hub repository (e.g., pipestreamai/platform-registration-service)'
        required: true
        type: string
      tags:
        description: 'Space-separated tags (e.g., "0.0.1 latest")'
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_TOKEN:
        required: true

jobs:
  push-to-dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.base_image }}" ] || [ -z "${{ inputs.dockerhub_repo }}" ] || [ -z "${{ inputs.tags }}" ]; then
            echo "Missing required inputs: base_image, dockerhub_repo, tags" >&2
            exit 1
          fi
          echo "Base image: ${{ inputs.base_image }}"
          echo "Docker Hub repo: ${{ inputs.dockerhub_repo }}"
          echo "Tags: ${{ inputs.tags }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Copy multi-arch image from GHCR to Docker Hub
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          echo "Processing tags: $TAGS"
          for TAG in $TAGS; do
            echo "Copying multi-arch manifest: $BASE_IMAGE:$TAG -> $DOCKERHUB_REPO:$TAG"
            docker buildx imagetools create -t "$DOCKERHUB_REPO:$TAG" "$BASE_IMAGE:$TAG"
          done
